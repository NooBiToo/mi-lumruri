[package]
name = "mi-tt-ctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "mi-trusttunnel controller: read, validate and preview device/network rules (read-only slice)"
license = "MIT"
publish = false

[lib]
name = "mi_tt"
path = "src/lib.rs"

# Непривилегированный: CLI проверки и CGI для панели. Кода применения сетевых изменений в нём нет.
[[bin]]
name = "mi-tt-ctl"
path = "src/main.rs"

# Административный: план, применение, статус и откат собственных правил маршрутизации (нужен CAP_NET_ADMIN).
[[bin]]
name = "mi-tt-admin"
path = "src/admin/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = { version = "0.10", default-features = false }
# Вход в панель: Argon2id (RustCrypto), TOTP RFC 6238 (totp-lite на RustCrypto hmac/sha1), случайность ОС
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
totp-lite = "2"
getrandom = "0.3"
data-encoding = "2"
subtle = { version = "2", default-features = false }
# Подпись релиза (Ed25519): mi-tt-admin release verify проверяет пакет обновления закреплённым ключом
ed25519-compact = { version = "2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

# Ввод секретов в административном CLI с терминала без эха (не через argv); CLI работает только на Linux-роутере
[target.'cfg(unix)'.dependencies]
rpassword = "7"
