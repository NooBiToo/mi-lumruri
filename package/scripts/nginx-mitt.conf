# mi-lumruri: отдельный экземпляр штатного nginx как TLS-терминатор панели (uhttpd стока 1.1.38 без ustream-ssl).
# Статика панели — из RAM; API — на uhttpd 127.0.0.1:@CGI@ (CGI mi-tt-ctl). Ключ и сертификат — свои для устройства.
worker_processes 1;
error_log @RUN@/log/nginx.error.log warn;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 9m;
    client_body_temp_path @RUN@/nginx-body;
    proxy_temp_path @RUN@/nginx-proxy;
    fastcgi_temp_path @RUN@/nginx-fastcgi;
    types { text/html html; text/javascript js; text/css css; image/svg+xml svg; image/x-icon ico; font/woff2 woff2; }
    server {
        listen @PORT@ ssl;
        ssl_certificate     @TLS@/cert.pem;
        ssl_certificate_key @TLS@/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # PrimeVue вставляет стили темы в <style> во время работы: inline разрешён только для стилей, скрипты — только свои
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        root @WWW@;
        index index.html;
        location /cgi-bin/api {
            proxy_pass http://127.0.0.1:@CGI@;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # признак HTTPS ставит только nginx; присланный клиентом X-Forwarded-Proto перезаписывается
            proxy_set_header X-Forwarded-Proto https;
            # штатный uhttpd передаёт CGI только фиксированный набор заголовков (Origin, Cookie, Authorization…, но не X-MITT-CSRF):
            # токен CSRF клиента перекладывается в Authorization; присланный клиентом Authorization всегда перезаписывается
            proxy_set_header Authorization "MITT-CSRF $http_x_mitt_csrf";
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
