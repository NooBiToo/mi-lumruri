name: BE7000 ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # сценарии роутера: синтаксис, конструкции, которых нет в BusyBox стока (дробный sleep и др.), ошибки shellcheck
      - name: Lint router scripts
        run: |
          for f in package/install.sh package/scripts/*.sh tools/device/*.sh; do sh -n "$f"; done
          python3 -I tools/lint-sh.py
          shellcheck -s sh -S error package/install.sh package/scripts/*.sh tools/device/*.sh

      - name: Test and compile controller
        working-directory: controller
        run: |
          cargo test --locked
          cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: Test and compile panel
        working-directory: panel
        run: |
          npm ci
          npm test
          npm run build

      # сквозные тесты панели: собранная панель на стенде (HTTPS → CGI → контроллер из cargo test), вход паролем и
      # одноразовым кодом, настройки, языки, резервная копия; Chromium Playwright
      - name: Panel end-to-end
        working-directory: panel
        env:
          MITT_BIN_DIR: ${{ github.workspace }}/controller/target/debug
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Panel end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            out/e2e-report
            out/e2e-results
          if-no-files-found: ignore

      # trusttunnel_client (aarch64, закреплён по SHA-256) скачивает сам tools/package.mjs
      - name: Fetch Zapret
        run: tools/lab/fetch-zapret.sh

      - name: Sign package
        env:
          SIGNING_KEY: ${{ secrets.BE7000_SIGNING_KEY }}
        run: |
          : "${SIGNING_KEY:?Configure the BE7000_SIGNING_KEY Actions secret}"
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          node tools/package.mjs --version "ci-${GITHUB_SHA:0:12}" --key "$key"

      - name: Verify signature and checksum
        run: |
          python3 -B tools/test-install.py
          (cd controller && cargo run --quiet --locked --bin mi-tt-admin -- release verify ../out/package/mi-lumruri)
          cd out/package
          # основной пакет и совместимая копия под прежним именем (обновление из панели 0.4.x)
          sha256sum mi-lumruri-*.tar mi-trusttunnel-*.tar > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          cp ../../install.py .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mi-lumruri-be7000
          path: |
            out/package/mi-lumruri-*.tar
            out/package/mi-trusttunnel-*.tar
            out/package/SHA256SUMS
            out/package/install.py
          if-no-files-found: error
          compression-level: 0
